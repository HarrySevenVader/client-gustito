<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo gris claro -->
  <rect width="400" height="400" fill="#E5E7EB"/>
  
  <!-- Ícono de cámara -->
  <g transform="translate(100, 60)">
    <!-- Cuerpo de la cámara -->
    <rect x="20" y="40" width="160" height="120" rx="8" fill="#9CA3AF"/>
    
    <!-- Flash superior -->
    <rect x="60" y="20" width="40" height="20" rx="4" fill="#9CA3AF"/>
    <rect x="150" y="35" width="15" height="15" rx="3" fill="#D1D5DB"/>
    
    <!-- Lente -->
    <circle cx="100" cy="100" r="35" fill="#6B7280"/>
    <circle cx="100" cy="100" r="25" fill="#D1D5DB"/>
    <circle cx="100" cy="100" r="15" fill="#9CA3AF"/>
    
    <!-- Detalles -->
    <rect x="150" y="55" width="20" height="20" rx="2" fill="#6B7280"/>
  </g>
  
  <!-- Texto "PRODUCTO SIN IMAGEN" -->
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#9CA3AF" text-anchor="middle">
    PRODUCTO SIN IMAGEN
  </text>
</svg>
